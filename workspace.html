<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Настройки агента</title>
<link rel="stylesheet" href="style.css">
<main class="settings">
  <h1>Настройки</h1>
  <section class="settings-card" aria-label="Основные настройки">
    <div class="setting-row">
      <div><strong>Результаты</strong><p id="folder-name">Не выбрано</p></div>
      <button id="folder" aria-expanded="false" aria-controls="storage-options">Изменить</button>
    </div>
    <div id="storage-options" class="storage-options" hidden>
      <button id="choose-folder">Папка устройства</button>
      <button id="internal">Внутри браузера</button>
      <small id="storage-hint"></small>
    </div>
    <div class="setting-row"><strong>DeepSeek</strong><span id="chat-status">Проверяю…</span></div>
    <div id="access-row" class="setting-row" hidden>
      <span id="access-label">Нужен доступ</span><button id="access">Предоставить</button>
    </div>
    <div class="setting-row"><span id="file-count">Файлы результатов</span><button id="files-toggle" aria-expanded="false" aria-controls="files-panel">Файлы</button></div>
  </section>
  <p id="status" role="status" hidden></p>
  <section id="files-panel" hidden aria-label="Файлы результатов"><p id="files-empty">Пока нет файлов</p><ul id="files"></ul></section>
  <details id="advanced">
    <summary>Дополнительно</summary>
    <label id="chat-choice" hidden>Чат<select id="deepseek-tab"></select></label>
    <label>Режим страниц<select id="mode"><option value="auto">Автоматически</option><option value="scripting">Совместимый</option></select></label>
    <button id="pick">Привязать интерфейс</button>
    <button id="diagnose">Диагностика</button>
    <pre id="diagnostics" hidden></pre>
    <p><a href="tests/index.html" target="_blank">Проверки расширения</a></p>
  </details>
  <p class="privacy-note">В режиме «Агент» задача и выбранные данные передаются в ваш чат DeepSeek.</p>
</main>
<script type="module" src="src/workspace.js"></script>
</html>
