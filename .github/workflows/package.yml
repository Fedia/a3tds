name: Package Chrome extension

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Node for syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src fixtures tests -type f -name '*.js' -print0)

      - name: Verify private Python Worker and CSP contract
        run: python3 .github/scripts/test_manifest.py

      - name: Validate local dependencies and create ZIP
        run: python3 .github/scripts/package.py

      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-agent-${{ github.sha }}
          path: |
            dist/deepseek-agent.zip
            dist/deepseek-agent.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified ZIP
        uses: actions/download-artifact@v4
        with:
          name: deepseek-agent-${{ github.sha }}
          path: dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check deepseek-agent.zip.sha256)
          cat > release-notes.md <<'NOTES'
          Распакуйте deepseek-agent.zip и загрузите папку deepseek-agent через chrome://extensions → Режим разработчика → Загрузить распакованное расширение.

          Агент выполняет обычные блоки Python из ответов DeepSeek последовательно. Python управляет рабочими вкладками, получает DOM и разбирает HTML через локальный BeautifulSoup. Финальный ответ — обычный текст.

          Разные диалоги работают одновременно: каждый со своим Python, состоянием, вкладками, историей и папкой. Повторный запуск того же диалога в другой вкладке блокируется. Остановка одного чата не затрагивает остальные. При конфликте записи в общую папку сохраняется отдельная копия для объединения данных.

          Выбранная папка целиком доступна стандартным библиотекам Python; перед каждым блоком выполняется os.chdir('/project'). Разрешены чтение, создание, перезапись, переименование и удаление файлов без отдельных подтверждений. Закрытые файлы сохраняются через долговечную очередь; перед браузерным действием и завершением блока расширение ждёт записи.

          Включены локальные Pyodide, NumPy, pandas, matplotlib и BeautifulSoup. Дополнительные совместимые пакеты устанавливаются через micropip из PyPI/CDN. Python работает в origin расширения без отдельной sandbox-изоляции.

          Старый JSON-протокол и обязательные каталоги tasks удалены. Прерванный сценарий не перезапускается вслепую; модель продолжает по своим checkpoint-файлам. Существующие пользовательские файлы при обновлении не удаляются.

          Управление находится над полем ввода DeepSeek; настройки открываются отдельно. После обновления перезагрузите расширение и вкладку чата. Инструкции и результаты проверок — в README.md и VALIDATION.md внутри архива.

          Это предварительная версия. Тестовая модель и фикстуры не заменяют проверку авторизованного DeepSeek. Установка в Windows/macOS и Titanium на устройстве требует ручной приёмки.
          NOTES
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/deepseek-agent.zip dist/deepseek-agent.zip.sha256 --clobber
          else
            gh release create "$TAG_NAME" dist/deepseek-agent.zip dist/deepseek-agent.zip.sha256 \
              --verify-tag --title "Агент для DeepSeek $TAG_NAME" \
              --notes-file release-notes.md --prerelease
          fi
