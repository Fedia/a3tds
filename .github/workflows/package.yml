name: Package Chrome extension

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Node for syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src fixtures tests -type f -name '*.js' -print0)

      - name: Verify private Python Worker and CSP contract
        run: python3 .github/scripts/test_manifest.py

      - name: Validate local dependencies and create ZIP
        run: python3 .github/scripts/package.py

      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: psy-agent-${{ github.sha }}
          path: |
            dist/psy-agent.zip
            dist/psy-agent.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified ZIP
        uses: actions/download-artifact@v4
        with:
          name: psy-agent-${{ github.sha }}
          path: dist

      - name: Publish MVP prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check psy-agent.zip.sha256)
          cat > release-notes.md <<'NOTES'
          Распакуйте psy-agent.zip и загрузите папку psy-agent через chrome://extensions → Режим разработчика → Загрузить распакованное расширение.

          Включены локальные Pyodide, NumPy, pandas и matplotlib; установки зависимостей не требуется. Инструкции — в README.md внутри архива.

          Управление встроено в DeepSeek: переключатель «Агент» и настройки. Элементы распознаются автоматически; ручная привязка касаниями остаётся запасным вариантом. Сайдбар не нужен. Настройки можно закрыть во время задачи. Для телефона доступны внутреннее хранилище и совместимый режим без CDP.

          Добавлены план сбора DOM, передача локальных файлов в Python и сохранение каждой страницы в tasks/<taskId>/pages/.

          Рабочие вкладки переиспользуются между переходами и задачами; отдельная вкладка открывается только при явной необходимости.

          Упрощены настройки и мобильный интерфейс: переключатель и шестерёнка над полем ввода, одна строка текущего шага, финальный ответ без служебных карточек. Отдельный переключатель передачи данных убран; режим агента использует текущий чат DeepSeek.

          Вернулась читаемая история действий и результатов. Ожидание DeepSeek показывает фазу и время; повторный трёхминутный таймаут удалён. Непринятый ответ не сворачивается до чтения его признаков завершения.

          Убраны лимиты числа шагов, общей длительности задачи и искусственный порог размера запроса. Уже остановленную по старому лимиту задачу можно продолжить без потери результатов. Таймауты отдельных операций сохранены.

          Сохранённая папка переиспользуется между запусками. При уже разрешённом доступе requestPermission больше не вызывается; повторные нажатия не создают несколько запросов.

          Python теперь работает фоновыми задачами без автоматического таймаута: модель проверяет прогресс и вывод через python.status и отменяет через python.cancel. Простые скрипты не загружают тяжёлые библиотеки. Добавлена совместимая загрузка локального WASM без streaming и сохранение результатов перед выгрузкой в папку.

          Исправлен manifest: HTML и загрузчик изолированной среды Python доступны для вложенного iframe. Проверка этих ресурсов добавлена в CI; сторонние сайты не могут отправлять задания sandbox.

          Добавлен micropip: установка дополнительных Python wheels из PyPI и совместимых сборок из CDN Pyodide, проверка SHA-256, верхнеуровневый await и прогресс загрузки. Ядро Python и JS остаются локальными.

          Постоянная общая Python-сессия без sandbox iframe, короткий JSON и блоки python.run, ref для элементов. Начальная справка не повторяется на каждом шаге. Python работает в origin расширения; сохранённые результаты остаются после сброса.

          Это предварительная версия. Локальные проверки пройдены; Titanium на устройстве, авторизованный DeepSeek и установка на Windows/macOS требуют ручной приёмки. Подробности — в VALIDATION.md.
          NOTES
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/psy-agent.zip dist/psy-agent.zip.sha256 --clobber
          else
            gh release create "$TAG_NAME" dist/psy-agent.zip dist/psy-agent.zip.sha256 \
              --verify-tag --title "Агент для DeepSeek $TAG_NAME" \
              --notes-file release-notes.md --prerelease
          fi
