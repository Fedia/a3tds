name: Package Chrome extension

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Node for syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src fixtures tests -type f -name '*.js' -print0)

      - name: Validate local dependencies and create ZIP
        run: python3 .github/scripts/package.py

      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: psy-agent-${{ github.sha }}
          path: |
            dist/psy-agent.zip
            dist/psy-agent.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified ZIP
        uses: actions/download-artifact@v4
        with:
          name: psy-agent-${{ github.sha }}
          path: dist

      - name: Publish MVP prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check psy-agent.zip.sha256)
          cat > release-notes.md <<'NOTES'
          Распакуйте psy-agent.zip и загрузите папку psy-agent через chrome://extensions → Режим разработчика → Загрузить распакованное расширение.

          Включены локальные Pyodide, NumPy, pandas и matplotlib; установки зависимостей не требуется. Инструкции — в README.md внутри архива.

          Это предварительный MVP. Локальные проверки пройдены; авторизованный DeepSeek и установка на Windows/macOS требуют ручной приёмки. Подробности — в VALIDATION.md.
          NOTES
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/psy-agent.zip dist/psy-agent.zip.sha256 --clobber
          else
            gh release create "$TAG_NAME" dist/psy-agent.zip dist/psy-agent.zip.sha256 \
              --verify-tag --title "ПсихоАгент $TAG_NAME" \
              --notes-file release-notes.md --prerelease
          fi
